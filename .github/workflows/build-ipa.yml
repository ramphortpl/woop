name: Build iOS IPA

# Builds an UNSIGNED Release .ipa of Woop on a macOS runner and publishes it:
#   - as a workflow artifact (Woop-ipa)
#   - as the asset of the rolling GitHub Release "ipa-latest", so the newest build is always at
#     https://github.com/<owner>/<repo>/releases/download/ipa-latest/Woop.ipa
# The .ipa is meant to be re-signed on the phone by any sideload signer (ESign, Feather,
# Scarlet, Sideloadly, AltStore...). No Apple account or certificate is needed to build it.

on:
  push:
    branches: ["main", "claude/**"]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        # actool (asset catalog) needs a simulator runtime matching the SDK; the macos-15 image
        # ships the iOS 18.5 runtime with Xcode 16.4, so pick that one explicitly (in order).
        run: |
          for XC in /Applications/Xcode_16.4.app /Applications/Xcode_26.2.app /Applications/Xcode_26.1.1.app; do
            if [ -d "$XC" ]; then sudo xcode-select -s "$XC"; break; fi
          done
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (Release, iphoneos, unsigned)
        run: |
          set -o pipefail
          xcodebuild -project Woop.xcodeproj -scheme Woop -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)|\*\* " || true
          grep -q "BUILD SUCCEEDED" build.log || { echo "---- errors ----"; grep -E "error:" build.log | head -100; exit 1; }

      - name: Package .ipa
        run: |
          APP=$(find build/dd/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -type d | head -1)
          test -n "$APP" || { echo ".app not found"; exit 1; }
          # Ad-hoc signature only so the bundle seal is consistent; any signer replaces it.
          codesign --force --deep --sign - "$APP"
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qry Woop.ipa Payload
          ls -lh Woop.ipa
          unzip -l Woop.ipa | tail -3

      - uses: actions/upload-artifact@v4
        with:
          name: Woop-ipa
          path: Woop.ipa
          if-no-files-found: error

      - name: Publish rolling release (ipa-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -E 'MARKETING_VERSION' project.yml | head -1 | sed -E 's/.*"(.*)".*/\1/')
          NOTES="Woop ${VER} (build ${GITHUB_RUN_NUMBER}) — commit ${GITHUB_SHA::7} sur ${GITHUB_REF_NAME}.

          IPA non signée : ouvre ce lien depuis ton iPhone ou colle-le dans ton signer (ESign, Feather, Scarlet, Sideloadly…) :
          https://github.com/${GITHUB_REPOSITORY}/releases/download/ipa-latest/Woop.ipa"
          gh release delete ipa-latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create ipa-latest Woop.ipa --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Woop iOS — dernière version (${VER} build ${GITHUB_RUN_NUMBER})" \
            --notes "$NOTES" --latest

  core-tests:
    # The platform-independent core (protocol, analytics, zip/CSV import, notifications) on macOS.
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          for XC in /Applications/Xcode_16.4.app /Applications/Xcode_26.2.app; do
            if [ -d "$XC" ]; then sudo xcode-select -s "$XC"; break; fi
          done
      - name: swift test
        run: swift test 2>&1 | tail -30

  screenshots:
    # Renders the app in the iOS Simulator (demo data) and publishes PNGs to the rolling
    # "screenshots" release, to check the interface against the WHOOP app.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          for XC in /Applications/Xcode_16.4.app /Applications/Xcode_26.2.app; do
            if [ -d "$XC" ]; then sudo xcode-select -s "$XC"; break; fi
          done
          xcodebuild -version

      - name: Generate project
        run: brew install xcodegen && xcodegen generate

      - name: Pick and boot a simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[x for rt,ds in d.items() if "iOS" in rt for x in ds if x["name"] in ("iPhone 16 Pro","iPhone 16","iPhone 15 Pro")]
          print(c[0]["udid"] if c else "")')
          test -n "$UDID" || { xcrun simctl list devices available; exit 1; }
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "16:13" --batteryState charged --batteryLevel 80 --cellularBars 4 --wifiBars 3 || true

      - name: Build for simulator (Release)
        run: |
          set -o pipefail
          xcodebuild -project Woop.xcodeproj -scheme Woop -configuration Release -sdk iphonesimulator \
            -destination "id=$UDID" -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO build 2>&1 \
            | tee sim.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" sim.log

      - name: Capture screens
        run: |
          APP=$(find build/sim/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots
          for S in home dashboard customize sleep recovery strain health community more coach device notifications import activity sports; do
            xcrun simctl launch "$UDID" com.ramphortpl.woop -woopDemo -woopScreen "$S" > /dev/null
            sleep 26
            xcrun simctl io "$UDID" screenshot "shots/$S.png"
            xcrun simctl terminate "$UDID" com.ramphortpl.woop || true
            sleep 1
          done
          ls -la shots

      - name: End-to-end WHOOP import (zip dropped in the app's Files folder)
        run: |
          APP=$(find build/sim/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          # Fresh install: no demo mode, no data.
          xcrun simctl uninstall "$UDID" com.ramphortpl.woop || true
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.ramphortpl.woop > /dev/null
          sleep 8
          xcrun simctl terminate "$UDID" com.ramphortpl.woop || true
          DATA=$(xcrun simctl get_app_container "$UDID" com.ramphortpl.woop data)
          ls -la "$DATA/Documents" || true
          python3 Tools/make_zip_fixtures.py --zip "$DATA/Documents/my_whoop_data_2026_11_08.zip"
          xcrun simctl launch "$UDID" com.ramphortpl.woop > /dev/null
          sleep 15
          xcrun simctl io "$UDID" screenshot "shots/import-result.png"
          echo "--- Documents after import ---"
          find "$DATA/Documents" -maxdepth 2 | sed "s|$DATA/||"
          test -f "$DATA/Documents/Importés/my_whoop_data_2026_11_08.zip" && echo "IMPORT: file moved to Importés"
          SQL=$(find "$DATA/Library/Application Support" -name 'woop.sqlite' | head -1)
          echo "imported days: $(sqlite3 "$SQL" 'SELECT COUNT(*) FROM imported_day')"
          echo "activities: $(sqlite3 "$SQL" "SELECT id, json_extract(json, '$.sport') FROM activity")"
          test "$(sqlite3 "$SQL" 'SELECT COUNT(*) FROM imported_day')" -ge 2

      - uses: actions/upload-artifact@v4
        with:
          name: Woop-screenshots
          path: shots

      - name: Publish screenshots release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete screenshots --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create screenshots shots/*.png --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Captures d'écran (simulateur, mode démo)" --notes "Commit ${GITHUB_SHA::7}" --prerelease
